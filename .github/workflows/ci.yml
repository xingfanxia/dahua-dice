name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static + unit gates. Need no secrets: the Upstash client tolerates missing env
  # (warns, never throws at import), and `next build` doesn't make Redis calls.
  check:
    name: typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Playwright e2e. The multiplayer specs create rooms, so they need real Upstash
  # credentials — gated on the repo secrets being present, and skipped cleanly
  # (still green) when they aren't. To enable: add KV_REST_API_URL and
  # KV_REST_API_TOKEN under Settings → Secrets and variables → Actions.
  e2e:
    name: e2e (chromium + webkit)
    runs-on: ubuntu-latest
    env:
      KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
      KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      # The suite drives many rooms/sessions from one CI IP; disable the per-IP
      # rate limits for the test server only (prod never sets this).
      RATE_LIMIT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect Redis secrets
        id: kv
        run: |
          if [ -n "$KV_REST_API_URL" ] && [ -n "$KV_REST_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Playwright browsers
        if: steps.kv.outputs.ok == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run e2e
        if: steps.kv.outputs.ok == 'true'
        run: pnpm e2e
      - name: Upload artifacts on failure
        if: steps.kv.outputs.ok == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Note when skipped
        if: steps.kv.outputs.ok != 'true'
        run: echo "::notice title=e2e skipped::Set KV_REST_API_URL and KV_REST_API_TOKEN repo secrets to run the multiplayer e2e suite in CI."
